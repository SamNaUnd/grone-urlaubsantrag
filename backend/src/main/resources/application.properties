spring.application.name=backend
spring.config.import=optional:file:.local/database.properties
server.address=${SERVER_ADDRESS:127.0.0.1}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/grone_urlaubsantrag}
spring.datasource.username=${DB_USERNAME:grone_app}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.error.include-message=never
server.error.include-stacktrace=never
app.setup-token=${SETUP_TOKEN:}
app.holiday-api-url=https://date.nager.at/api/v3
springdoc.swagger-ui.path=/api/docs
springdoc.api-docs.path=/api/openapi
springdoc.swagger-ui.csrf.enabled=true
